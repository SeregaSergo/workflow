version: 1
data_dir: ~/wf

defaults:
  max_iterations: 3

claude:
  # Модель по умолчанию для всех фаз. null = SDK сам выберет.
  model: null
  # Override модели для конкретных фаз. Ключ — имя фазы (explore/coding/
  # review/...), значение — model id (например, claude-opus-4-7).
  # Удобно, когда хочется на этапе написания кода держать самую сильную модель,
  # а остальные фазы оставить на дефолте.
  phase_models:
    coding: claude-opus-4-7
    # Сообщение коммита при закрытии раунда правок (wf push / wf resume без -m):
    # короткий вызов без тулов, хватит быстрой модели.
    # commit_message: claude-haiku-4-5
  # Какие MCP-серверы (по именам из верхнеуровневого mcp_servers: ниже)
  # доступны каждой LLM-фазе. Ключ — имя фазы, значение — список серверов.
  # Серверы передаются в claude-agent-sdk напрямую (mcp_servers); под
  # bypassPermissions их инструменты (mcp__<server>__*) доступны фазе сразу.
  # phase_mcp_servers:
  #   explore: [wiki]

# MCP-серверы для LLM-фаз. Форма записи повторяет блок mcpServers из
# ~/.claude.json, так что конфиг из обычной сессии Claude Code можно
# скопировать почти как есть. Включать сервер для конкретной фазы — через
# claude.phase_mcp_servers выше (по умолчанию ни одна фаза MCP не получает).
#
# stdio-сервер (локальный процесс):
#   mcp_servers:
#     wiki:
#       type: stdio                # необязательно, stdio по умолчанию
#       command: /usr/local/bin/wiki
#       args: ["mcp", "--read-only"]
#       env: {}
#
# http|sse-сервер (удалённый):
#   mcp_servers:
#     acme:
#       type: http                 # либо sse
#       url: "https://api.example.com/mcp"
#       headers:
#         Authorization: "Bearer ${ACME_TOKEN}"
mcp_servers: {}

# Внешние инструменты, которые вызывают фазы. cmd рендерится через jinja2,
# доступ к контексту фазы (см. runner.run_tool).
#
# В контексте любого инструмента доступны поля задачи (runner.tool_context):
#   task_id, task_url, task_title, workflow, branch, base_branch,
#   repo_path, worktree, mr_url, iteration
# Незаполненные поля приходят пустой строкой, а не ошибкой рендера.
# Плюс пофазные ключи:
#   fetch_task    (фазы `explore` и `qa_notes`, обязателен): {{task_id}};
#                 должен печатать JSON с полем "tags" (по нему qa_notes
#                 узнаёт тег NoQA). Без плейсхолдера id дописывается в конец
#   fetch_article (фаза `explore`, необязателен): {{article_id}}
#   create_mr (фаза `mr`, cwd = worktree): —
#   notify    (фаза `notify`, cwd = worktree): channel_id, reviewers,
#             message (готовая отрендеренная строка с возможными \n внутри)
#   qa_comment (фаза `qa_notes`, обязателен, cwd = worktree): qa_notes —
#             текст QA-заметки; публикует её в задачу (и двигает статус)
#   open_ide  (`wf open`, необязателен, cwd = worktree): открыть worktree в IDE
#   fetch_mr_comments (`wf open`, необязателен, cwd = worktree): печатает
#             открытые треды MR — они попадут в контекст Claude на раунд правок
#
# Разбор команды:
#   - по умолчанию отрендеренная строка разбивается shlex.split и запускается
#     напрямую, без шелла: $VAR не раскрывается, ~ — только в виде ~/ или ~user/
#   - если в самом шаблоне cmd есть shell-операторы (&& || ; | & > < $( `),
#     команда уходит в /bin/sh -c целиком. Проверяется шаблон, а не значения:
#     `|` внутри {{...}} — это jinja-фильтр и шелл не включает, а метасимволы
#     из подставленного текста ничего не переключают
#   - аргументы с пробелами/переводами строк/кавычками прогоняйте через
#     фильтр |shquote (обёртка над shlex.quote) — в обоих режимах
#
# tools:
#   # explore не запускает эти две команды сам: из cmd вырезается плейсхолдер
#   # ({{task_id}} / {{article_id}}), а остаток уходит в промпт как команда,
#   # которую модель вызывает через Bash с нужным id.
#   fetch_task:
#     cmd: "youtrack get {{task_id}}"
#   fetch_article:
#     cmd: "youtrack article get {{article_id}}"
#   create_mr:
#     cmd: "glab mr create --source-branch {{branch}} --target {{base_branch}} --title {{task_id|shquote}} --yes"
#   notify:
#     cmd: "mynotify {{channel_id}} {{message|shquote}}"
#   # цепочка: уведомление в чат + комментарий в трекер
#   notify:
#     cmd: >-
#       mynotify {{channel_id}} {{message|shquote}}
#       && youtrack add-comment {{task_id}} {{("мр " ~ mr_url)|shquote}}
#   qa_comment:
#     cmd: >-
#       youtrack add-comment {{task_id}} {{qa_notes|shquote}}
#       && youtrack set-state {{task_id}} "Waiting for test"
#   open_ide:
#     cmd: "code {{worktree}}"
#   # нерешённые треды MR (glab + jq): путь:строка и реплики
#   fetch_mr_comments:
#     cmd: >-
#       glab api "projects/:fullpath/merge_requests/$(basename {{mr_url|shquote}})/discussions?per_page=100"
#       | jq -r '.[] | select((.notes[0].system | not) and (.notes[0].resolved | not))
#       | "### " + (.notes[0].position.new_path // "общее")
#       + (if .notes[0].position.new_line then ":" + (.notes[0].position.new_line | tostring) else "" end)
#       + "\n" + ([.notes[] | select(.system | not) | "- @" + .author.username + ": " + .body] | join("\n")) + "\n"'
tools: {}

workflows:
  coding:
    notify_channel_id: "REPLACE_ME"   # canonical channel for MR notifications
    reviewers: []                     # @logins/имена ревьюверов, выводятся одной строкой в notify
    # Список фаз, перед которыми движок останавливается и просит `wf resume`.
    # Пустой список (по умолчанию) = без пауз. На паузе можно открыть раунд
    # правок (`wf open`). Типовая схема: вычитка до MR; ревью коллег и
    # выкатка на стенд — до QA-заметки (она сразу публикуется в задачу):
    # pause_before: [mr, qa_notes]
